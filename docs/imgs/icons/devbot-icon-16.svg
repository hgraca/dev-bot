<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="devbot icon">
  <title>devbot</title>
  <rect width="16" height="16" rx="3.5" fill="#141B40"/>

  <!-- antenna reduced to a single dot -->
  <circle cx="8" cy="2.4" r="1.4" fill="#FFB454"/>
  <path d="M8 4.4 V 3.4" stroke="#8B96C9" stroke-width="1.2" stroke-linecap="round"/>

  <!-- head -->
  <rect x="2" y="4.4" width="12" height="9.2" rx="2.6" fill="#E4E8F7"/>

  <!-- visor slot with cursor: the only interior detail that survives -->
  <rect x="4" y="7" width="8" height="4.4" rx="1.4" fill="#121734"/>
  <rect x="5.1" y="8.2" width="1.5" height="2" rx="0.4" fill="#6C7BFF"/>
  <rect x="7.4" y="8.2" width="3.4" height="2" rx="0.4" fill="#FFB454"/>
</svg>
