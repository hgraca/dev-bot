  <!-- head -->
  <rect x="4.5" y="8.5" width="23" height="17.5" rx="5" fill="url(#sh32)"/>

  <!-- visor -->
  <rect x="7.5" y="11.5" width="17" height="9.5" rx="3.2" fill="#121734"/>
  <path d="M11 14 L 13.4 16.25 L 11 18.5" fill="none" stroke="#6C7BFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="15.6" y="14.6" width="5.4" height="3.3" rx="0.8" fill="#FFB454"/>
