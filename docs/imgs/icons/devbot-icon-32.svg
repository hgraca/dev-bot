<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="devbot icon">
  <title>devbot</title>
  <defs>
    <linearGradient id="bg32" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2450"/>
      <stop offset="1" stop-color="#0B0F26"/>
    </linearGradient>
    <linearGradient id="sh32" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F4F5FC"/>
      <stop offset="1" stop-color="#C6CCEC"/>
