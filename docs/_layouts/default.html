<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | truncatewords: 50 }}">
  {% seo %}
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/imgs/icons/devbot-icon-32.png' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/imgs/icons/devbot-icon.svg' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/imgs/icons/devbot-icon-512.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  {% include nav.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true, theme: 'dark' });
  </script>
  <script>
    // Mobile nav toggle
    document.querySelector('.nav-toggle')?.addEventListener('click', function() {
      const links = document.querySelector('.nav-links');
      const expanded = this.getAttribute('aria-expanded') === 'true';
      this.setAttribute('aria-expanded', !expanded);
      links.classList.toggle('open');
    });
    // Mobile dropdown toggle
    document.querySelectorAll('.nav-dropdown-trigger').forEach(function(trigger) {
      trigger.addEventListener('click', function(e) {
        if (window.innerWidth <= 768) {
          e.preventDefault();
          this.parentElement.classList.toggle('open');
        }
      });
    });
  </script>
  <script>
    // Install command + GitHub links: derive the repo location from the GitHub
    // Pages URL (https://<org>.github.io/<repo>/) so it stays correct if the
    // repository moves; fall back to the server-rendered _config.yml values
    // (rendered as data-* attributes) otherwise.
    (function () {
      var first = document.querySelector('.hero-install-cmd');
      if (!first) return;

      var fallbackHost = first.dataset.installHost || 'github.com';
      var fallbackOrg = first.dataset.installOrg || 'GET-E';
      var fallbackRepo = first.dataset.installRepo || 'dev-bot';
      var fallbackBranch = first.dataset.installBranch || 'main';

      var hostParts = window.location.hostname.split('.');
      var pathParts = window.location.pathname.split('/').filter(Boolean);
      var org = fallbackOrg;
      var repo = fallbackRepo;
      if (hostParts.length >= 3 &&
          hostParts[hostParts.length - 2] === 'github' &&
          hostParts[hostParts.length - 1] === 'io') {
        org = hostParts[0];
        if (pathParts.length > 0) repo = pathParts[0];
      }

      function flashCopied(btn) {
        btn.setAttribute('data-copied', '');
        setTimeout(function () { btn.removeAttribute('data-copied'); }, 1500);
      }

      function copyCommand(command, btn) {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(command).then(function () { flashCopied(btn); });
        } else {
          var ta = document.createElement('textarea');
          ta.value = command;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); flashCopied(btn); } catch (e) {}
          document.body.removeChild(ta);
        }
      }

      document.querySelectorAll('.hero-install-cmd').forEach(function (code) {
        var branch = code.dataset.installBranch || fallbackBranch;
        var command = 'curl -fsSL https://raw.githubusercontent.com/' + org + '/' + repo + '/' + branch + '/install.sh | bash -s -- --org ' + org;
        var text = code.querySelector('.hero-install-cmd-text');
        if (text) text.textContent = '$ ' + command;
        code.addEventListener('click', function () { copyCommand(command, code); });
      });

      var ghHref = 'https://github.com/' + org + '/' + repo;
      document.querySelectorAll('.gh-link').forEach(function (a) { a.href = ghHref; });
    })();
  </script>
</body>
</html>
