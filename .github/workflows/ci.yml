name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: |
          npm install -g prettier@3.9.4
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ -C /tmp
          sudo install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
      - run: make lint

  # The BATS suite is ~99% of the test runtime, and one job spends most of its
  # wall clock with a worker idle. Running it as three parallel jobs — one matrix
  # slice each — brings the suite down to about a third of the time. The split is
  # computed by `make test-bats-slice` from the files in git, so a new test file
  # is picked up without editing this workflow.
  test-slice:
    name: test-slice (${{ matrix.slice }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # A failing slice must not cancel the others: the run should report all
      # three results, not just the first one to go red.
      fail-fast: false
      matrix:
        slice: [1, 2, 3]
    env:
      DEV_BOT_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tooling
        run: |
          npm install -g prettier@3.9.4 bats@1.13.0 bats-assert@2.2.4 bats-support@0.3.0
          sudo apt-get update
          sudo apt-get install -y jq parallel
      - name: Prepare test fixtures
        run: |
          cp .devbot.global.dist.jsonc .devbot.global.jsonc
          touch .env
          git config --global user.name "devbot CI"
          git config --global user.email "ci@devbot.local"
          bash src/tools/devbot-cli/init.sh "$GITHUB_WORKSPACE"
      - name: Run BATS slice ${{ matrix.slice }}/3
        run: make test-bats-slice SLICE=${{ matrix.slice }}
      # The bun and python suites take seconds, so they ride along on the first
      # slice instead of paying for a job of their own.
      - name: Run the bun and python suites
        if: matrix.slice == 1
        run: make test-ts test-py

  # Branch protection on main requires the status check named exactly `test`, so
  # the slices report under their own names and this gate carries the required
  # one. It fails — rather than reporting skipped — whenever a slice is not green,
  # so the required check never silently passes on a red suite.
  test:
    name: test
    needs: test-slice
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every BATS slice passed
        run: |
          echo "test-slice: ${{ needs.test-slice.result }}"
          [ "${{ needs.test-slice.result }}" = "success" ]
