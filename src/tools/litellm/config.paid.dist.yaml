general_settings:
  master_key: sk-litellm-master-key # CHANGE THIS in production
  database_url: null # SQLite by default

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 600
  default_fallbacks: []

router_settings:
  num_retries: 3 # Global default for real models
  fallbacks:
    - orchestrator:
        - cortecs.deepseek-v4-flash.high
    - architect:
        - cortecs.deepseek-v3.2
    - po:
        - cortecs.qwen3-vl-235b-a22b
    - critic:
        - cortecs.qwen3-next-80b-a3b-thinking
    - developer:
        - cortecs.qwen3-coder-next
    - tester:
        - cortecs.qwen3-coder-30b-a3b-instruct
    - reviewer:
        - cortecs.deepseek-r1-0528
    - security:
        - cortecs.deepseek-v4-pro.high
    - scout:
        - cortecs.deepseek-v4-flash.low

model_list:
  # ── Placeholder models ─────────────────────────────────────────────────────────────

  - model_name: orchestrator
    litellm_params:
      model: openai/noop
      num_retries: 0 # 👈 per-model, overrides global
    model_info:
      allowed_fails: 1
      cooldown_time: 86400 # 24h

  - model_name: architect
    litellm_params:
      model: openai/noop
      num_retries: 0 # 👈 per-model, overrides global
    model_info:
      allowed_fails: 1
      cooldown_time: 86400 # 24h

  - model_name: po
    litellm_params:
      model: openai/noop
      num_retries: 0 # 👈 per-model, overrides global
      reasoning_effort: "high"
    model_info:
      allowed_fails: 1
      cooldown_time: 86400 # 24h

  - model_name: critic
    litellm_params:
      model: openai/noop
      num_retries: 0 # 👈 per-model, overrides global
    model_info:
      allowed_fails: 1
      cooldown_time: 86400 # 24h

  - model_name: developer
    litellm_params:
      model: openai/noop
      num_retries: 0 # 👈 per-model, overrides global
    model_info:
      allowed_fails: 1
      cooldown_time: 86400 # 24h

  - model_name: tester
    litellm_params:
      model: openai/noop
      num_retries: 0 # 👈 per-model, overrides global
    model_info:
      allowed_fails: 1
      cooldown_time: 86400 # 24h

  - model_name: reviewer
    litellm_params:
      model: openai/noop
      num_retries: 0 # 👈 per-model, overrides global
    model_info:
      allowed_fails: 1
      cooldown_time: 86400 # 24h

  - model_name: security
    litellm_params:
      model: openai/noop
      num_retries: 0 # 👈 per-model, overrides global
    model_info:
      allowed_fails: 1
      cooldown_time: 86400 # 24h

  - model_name: scout
    litellm_params:
      model: openai/noop
      num_retries: 0 # 👈 per-model, overrides global
    model_info:
      allowed_fails: 1
      cooldown_time: 86400 # 24h

