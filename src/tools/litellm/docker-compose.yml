# LiteLLM proxies ollama models. It depends on the ollama service, which is
# defined by the ollama module's compose — include it so the dependency
# resolves even when the ollama module is disabled in the `modules` map
# (litellm's own `depends_on` below would dangle on an undefined service).
# The include path is ABSOLUTE via ${DEV_BOT_ROOT}: docker compose resolves a
# relative `include:` in any non-first `-f` file against the FIRST file's
# directory, so an absolute path keeps this order-independent when up.sh -f's
# several fragments together. DEV_BOT_ROOT is exported by every dev-bot
# compose invocation.
#
# `name: devbot` — the project name is read from the FIRST -f file; declaring
# it here keeps every dev-bot container in one project regardless of which
# fragment is first (otherwise it derives from this directory name).
name: devbot
include:
  - ${DEV_BOT_ROOT}/src/tools/ollama/docker-compose.yml

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: dev-bot-litellm
    restart: "no"
    ports:
      - "127.0.0.1:18000:4000"
    env_file:
      - ../../../.env
    volumes:
      - ./litellm.config.yaml:/app/config/config.yaml
    command: ["--port", "4000", "--config", "/app/config/config.yaml"]
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", 'python3 -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:4000/health/readiness'')"']
      interval: 10s
      timeout: 5s
      retries: 12
