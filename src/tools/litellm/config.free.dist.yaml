general_settings:
  master_key: sk-litellm-master-key # CHANGE THIS in production
  database_url: null # SQLite by default

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 600
  default_fallbacks: []

router_settings:
  num_retries: 3 # Global default for real models
  fallbacks:
    - orchestrator:
        - gemini.free.gemini-2.5-flash
        - puter.free.gemini-2.5-flash
    - architect:
        - opencode.free.nemotron-3-super-free # 12B/120B MoE
    - po:
        - opencode.free.deepseek-v4-flash-free.high # 13B/284B MoE
        - gemini.free.gemini-2.5-flash
        - puter.free.gemini-2.5-flash
    - critic:
        - opencode.free.nemotron-3-super-free # 12B/120B MoE
    - developer:
        - openrouter.free.qwen3-coder-480b-a35b-instruct:free # 35B/480B MoE
        - puter.free.qwen3-coder-480b-a35b-instruct # 35B/480B MoE
    - tester:
        - opencode.free.big-pickle
        - puter.free.qwen-2.5-72b-instruct # 72B
    #      - local.free.qwen2.5-coder:7b # good for code completions, might not fit your laptop
    - reviewer:
        - puter.free.qwen-2.5-72b-instruct
        - groq.free.llama-4-maverick-17b-128e-instruct # 17B/400B MoE
        - puter.free.llama-4-maverick-17b-128e-instruct # 17B/400B MoE
    - security:
        - opencode.free.nemotron-3-super-free # 12B/120B MoE
    - scout:
        - opencode.free.deepseek-v4-flash-free.low # 13B/284B MoE

model_list:
  # ── Placeholder models ─────────────────────────────────────────────────────────────

  - model_name: orchestrator
    litellm_params:
      model: openai/noop
      num_retries: 0 # 👈 per-model, overrides global
    model_info:
      allowed_fails: 1
      cooldown_time: 86400 # 24h

  - model_name: architect
    litellm_params:
      model: openai/noop
      num_retries: 0 # 👈 per-model, overrides global
    model_info:
      allowed_fails: 1
      cooldown_time: 86400 # 24h

  - model_name: po
    litellm_params:
      model: openai/noop
      num_retries: 0 # 👈 per-model, overrides global
      reasoning_effort: "high"
    model_info:
      allowed_fails: 1
      cooldown_time: 86400 # 24h

  - model_name: critic
    litellm_params:
      model: openai/noop
      num_retries: 0 # 👈 per-model, overrides global
    model_info:
      allowed_fails: 1
      cooldown_time: 86400 # 24h

  - model_name: developer
    litellm_params:
      model: openai/noop
      num_retries: 0 # 👈 per-model, overrides global
    model_info:
      allowed_fails: 1
      cooldown_time: 86400 # 24h

  - model_name: tester
    litellm_params:
      model: openai/noop
      num_retries: 0 # 👈 per-model, overrides global
    model_info:
      allowed_fails: 1
      cooldown_time: 86400 # 24h

  - model_name: reviewer
    litellm_params:
      model: openai/noop
      num_retries: 0 # 👈 per-model, overrides global
    model_info:
      allowed_fails: 1
      cooldown_time: 86400 # 24h

  - model_name: security
    litellm_params:
      model: openai/noop
      num_retries: 0 # 👈 per-model, overrides global
    model_info:
      allowed_fails: 1
      cooldown_time: 86400 # 24h

  - model_name: scout
    litellm_params:
      model: openai/noop
      num_retries: 0 # 👈 per-model, overrides global
    model_info:
      allowed_fails: 1
      cooldown_time: 86400 # 24h

