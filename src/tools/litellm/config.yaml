general_settings:
  master_key: sk-litellm-master-key # CHANGE THIS in production
  database_url: null # SQLite by default

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 600
  default_fallbacks: []

router_settings:
  num_retries: 3 # Global default for real models
  fallbacks:
    - orchestrator:
        - opencode.free.deepseek-v4-flash-free.low # 13B/284B MoE
    - architect:
        - opencode.free.deepseek-v4-flash-free.high # 13B/284B MoE
    - po:
        - opencode.free.deepseek-v4-flash-free.high # 13B/284B MoE
    - critic:
        - opencode.free.deepseek-v4-flash-free.high # 13B/284B MoE
    - developer:
        - opencode.free.deepseek-v4-flash-free.low # 13B/284B MoE
    - tester:
        - opencode.free.deepseek-v4-flash-free.low # 13B/284B MoE
    - reviewer:
        - opencode.free.deepseek-v4-flash-free.low # 13B/284B MoE
    - security:
        - opencode.free.deepseek-v4-flash-free.low # 13B/284B MoE
    - scout:
        - opencode.free.deepseek-v4-flash-free.low # 13B/284B MoE
    - highest:
        - opencode.free.deepseek-v4-flash-free.low # 13B/284B MoE
    - high:
        - opencode.free.deepseek-v4-flash-free.low # 13B/284B MoE
    - default:
        - opencode.free.deepseek-v4-flash-free.low # 13B/284B MoE
    - low:
        - opencode.free.deepseek-v4-flash-free.low # 13B/284B MoE
    - lowest: # ~ local, for code completions
        - opencode.free.deepseek-v4-flash-free.low # 13B/284B MoE
        # - local.free.qwen2.5-coder:7b
        # - cortecs.qwen-2.5-72b-instruct # $0.062

model_list:
  # ── Placeholder models ─────────────────────────────────────────────────────────────

  - model_name: orchestrator
    litellm_params:
      model: openai/noop
      num_retries: 0 # 👈 per-model, overrides global
    model_info:
      allowed_fails: 1
      cooldown_time: 86400 # 24h

  - model_name: architect
    litellm_params:
      model: openai/noop
      num_retries: 0 # 👈 per-model, overrides global
    model_info:
