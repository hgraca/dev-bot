# src/agentic/datasources/compose.tpl.yml
# TEMPLATE — rendered by render.sh into storage/datasources/docker-compose.yml.
#
# Not a plain module docker-compose.yml, for one reason: the gateway must
# receive every env var the declared datasources reference, and those names are
# dynamic (they come from .devbot.global.jsonc). A static compose file cannot
# enumerate them. Because the rendered file lives under storage/, bin/up.sh's
# compose discovery (src/{tools,agentic,harnesses}) does not see it — this
# module brings its own compose up and down in up.sh / down.sh.
#
# Only env var NAMES are written here, never values: compose interpolates the
# values from the environment `devbot up` builds, so no credential touches disk.
name: devbot

services:
  datasources-mcp:
    image: ${TOOLBOX_IMAGE}:${TOOLBOX_VERSION}
    container_name: dev-bot-datasources-mcp
    # Started on demand by `devbot up` and left running, like every other
    # dev-bot gateway: deliberately not `unless-stopped`, so it does not return
    # on its own after a reboot without `devbot up` starting its neighbours.
    restart: "no"
    # Host uid/gid, so a file-backed engine (sqlite) can write its journal
    # beside the database. bin/up.sh exports DEV_UID/DEV_GID.
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    # Host networking, deliberately: databases on this machine are normally
    # published on the host's 127.0.0.1, which a bridged container cannot
    # reach (`host.docker.internal` resolves to the bridge gateway, not the
    # loopback). Sharing the host's network namespace also means the
    # container's view is IDENTICAL to the host-side reachability probe — so
    # whatever the probe finds reachable really is reachable, which is what
    # makes activation trustworthy. It also removes the need for a port
    # mapping: the server binds the host's loopback directly.
    #
    # Limitation: host networking is a Linux capability. macOS/Windows Docker
    # Desktop would need `host.docker.internal` and databases published on
    # 0.0.0.0 instead.
    network_mode: host
    volumes:
      # Mounted as a DIRECTORY rather than a single file, so the config can
      # grow to several files without touching the container spec. The poller
      # also rewrites tools.yaml IN PLACE (see render.sh): toolbox tracks the
      # config file by inode, so a replaced file is invisible to its reloader
      # and the change would silently never take effect.
      - ${DEV_BOT_ROOT}/storage/datasources/conf:/app/conf:ro
      # File-backed engines (sqlite) read and write their database under /data
      # — sqlite also needs the directory writable, to create its journal
      # beside the file. A sqlite datasource's SQLITE_DATABASE must therefore
      # be a path like /data/<name>.db. Network engines ignore this mount.
      - ${DEV_BOT_ROOT}/storage/datasources/data:/data
    # Exec form, never a shell string: the toolbox image is distroless, so a
    # command run through a shell would fail for want of /bin/sh.
    command:
      - --config-folder
      - /app/conf
      - --address
      # Loopback only. With host networking there is no port mapping between
      # the container and the host, so this is what keeps the gateway off the
      # LAN — upstream defaults to 127.0.0.1, but stating it makes the
      # guarantee explicit rather than incidental.
      - 127.0.0.1
      - --port
      - "18510"
      # Reject Host headers that are not local. The server holds free-form DB
      # access, so DNS-rebinding protection matters even on 127.0.0.1.
      - --allowed-hosts
      - 127.0.0.1,localhost
      # Same reasoning for browser origins — upstream warns that the default
      # wildcard lets any website reach the gateway.
      - --allowed-origins
      - http://127.0.0.1:18510
      # Poll for config changes. Required, not a nicety: the config is a bind
      # mount that the refresh poller rewrites from the host, and inotify
      # events across a bind mount are unreliable — precisely the case
      # upstream documents --poll-interval for. Together with the in-place
      # rewrite this is what makes a database that comes up later activate
      # WITHOUT a restart.
      - --poll-interval
      - "5"
    environment: __DATASOURCE_ENV__
