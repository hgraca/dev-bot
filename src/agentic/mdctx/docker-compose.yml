# src/agentic/mdctx/docker-compose.yml
# Shared mdctx MCP gateway. Auto-discovered by bin/up.sh (maxdepth 2 under each
# module dir) and gated by disabled_modules — the container starts only when the
# mdctx module is enabled.
#
# `name: devbot` — the compose project name is read from the FIRST -f file;
# every dev-bot compose file declares the same name so all containers land in
# one project regardless of which file is first.
#
# The image is built on first `devbot up` (compose builds a `build:` service
# whose image is missing); later runs reuse it, and bin/up.sh rebuilds it when
# the Dockerfile changes. A manual rebuild needs DEV_BOT_ROOT set — see the
# build.context note below:
#   DEV_BOT_ROOT="$(pwd)" docker compose -f src/agentic/mdctx/docker-compose.yml build
name: devbot

services:
  mdctx-mcp:
    build:
      # ABSOLUTE, via ${DEV_BOT_ROOT}: compose resolves a relative context
      # against the FIRST -f file's directory, not this module's. With up.sh's
      # single -f list, `context: .` pointed at src/tools/ollama and the build
      # died with "failed to read dockerfile" whenever no image existed yet.
      # Same rule the consumer fragments' `include:` already documents.
      context: ${DEV_BOT_ROOT}/src/agentic/mdctx
    image: dev-bot-mdctx-mcp:local
    container_name: dev-bot-mdctx-mcp
    # Started on demand by `devbot up` and left running. Deliberately NOT
    # `unless-stopped`: the gateway is a dev machine service tied to the dev-bot
    # services around it, so it should not come back on its own after a reboot
    # without `devbot up` having started its neighbours.
    restart: "no"
    # Run as the HOST uid/gid, not root: the container writes the shared index,
    # and a root-owned file there would block the host `reindex` tool. Matches
    # the codebase-memory gateway. bin/up.sh exports DEV_UID/DEV_GID.
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    ports:
      # Host-local only — the gateway is never exposed off the machine.
      - "127.0.0.1:18501:18501"
    volumes:
      # The MCP server serves the machine-global memory store; the index is
      # shared with the host tools (search-memories, reindex) so both see the
      # same file.
      #
      # READ-ONLY: the server only ever reads the markdown corpus. Its sole
      # write is the index file — indexer.js uses readFile/readdir plus a single
      # writeFile to the index path, and the server never imports the config
      # writer. Least privilege: the search server must not be able to mutate
      # the git-tracked knowledge base.
      # create_host_path: false — the store is tracked, so it always exists; a
      # missing one is a misconfiguration and must fail loudly.
      - type: bind
        source: ${DEV_BOT_ROOT}/storage/global-memories
        target: /data/global-memories
        read_only: true
        bind:
          create_host_path: false
      # READ-WRITE: the `refresh_index` tool — and loadIndex's auto-heal of a
      # missing/corrupt/version-mismatched index — rewrites context-index.json.
      # Its source is pre-created by bin/up.sh (_ensure_writable_bind_sources):
      # a MISSING bind source is created by the daemon as root:root, and this
      # container runs as the host uid, which then cannot write the index.
      - ${DEV_BOT_ROOT}/storage/.mdctx:/data/.mdctx
    environment:
      MDCTX_ROOT: /data/global-memories
      MDCTX_INDEX: /data/.mdctx/context-index.json
    healthcheck:
      # Liveness via a real MCP handshake on the container's own port, so
      # `docker ps` shows a gateway that has stopped answering as unhealthy.
      # python3, not curl: the bridge images install python3 for mcp-proxy and
      # carry no HTTP client.
      test:
        - CMD
        - python3
        - -c
        - |
          import json, sys, urllib.request
          body = json.dumps({"jsonrpc": "2.0", "id": 1, "method": "initialize",
                             "params": {"protocolVersion": "2024-11-05",
                                        "capabilities": {},
                                        "clientInfo": {"name": "healthcheck", "version": "1"}}}).encode()
          req = urllib.request.Request(
              "http://127.0.0.1:18501/mcp", data=body,
              headers={"Content-Type": "application/json",
                       "Accept": "application/json, text/event-stream"})
          sys.exit(0 if urllib.request.urlopen(req, timeout=3).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
