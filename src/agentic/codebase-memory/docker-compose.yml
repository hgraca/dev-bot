# src/agentic/codebase-memory/docker-compose.yml
# Shared codebase-memory MCP gateway. Auto-discovered by bin/up.sh (maxdepth 2
# under each module dir) and gated by disabled_modules — the container starts
# only when the codebase-memory module is enabled.
#
# `name: devbot` — the compose project name is read from the FIRST -f file;
# every dev-bot compose file declares the same name so all containers land in
# one project regardless of which file is first.
#
# The image is built on first `devbot up` (compose builds a `build:` service
# whose image is missing); later runs reuse it, and bin/up.sh rebuilds it when
# the Dockerfile changes. A manual rebuild needs DEV_BOT_ROOT set — see the
# build.context note below:
#   DEV_BOT_ROOT="$(pwd)" docker compose -f src/agentic/codebase-memory/docker-compose.yml build
#
# STORE — a named volume, NOT a host bind mount.
#   The index store lives on the Docker named volume below, mounted at /srv/cbm,
#   so it sits on the VM's own filesystem where chmod is a real syscall. A host
#   bind mount cannot be used here: on Docker Desktop for macOS a container
#   chmod on a bind-mounted directory is emulated by writing
#   `user.containers.override_stat` on the host with uid:gid ALWAYS 0:0,
#   whichever uid the container runs as. codebase-memory-mcp chmods its cache
#   dir 0700 on every start and validates that it owns it, so the first start
#   poisons the directory to root-owned and every later start refuses
#   ("exact executable identity could not be verified (cache-private)" /
#   "CBM daemon could not start within 30000 ms"). Clearing the xattr does not
#   stick — the next start rewrites it.
#   The volume survives `docker rm`, `docker compose down` (dev-bot never passes
#   -v) and reboots; only `docker compose down -v`, `docker volume rm` and
#   `docker system prune --volumes` delete it, costing a re-index.
#
# MOUNTS — repos are still bind-mounted, read-only, at their real absolute paths.
#   The server's tools take `repo_path` per call, so repos must appear at their
#   real paths inside the container. Docker fixes mounts at container CREATION
#   (there is no live attach), and this gateway is shared by every instance — so
#   the mount set is a machine-level property, not a per-instance one. A single
#   root, defaulting to $HOME, means every project path already resolves with no
#   per-project action. Narrow it (e.g. to ~/Development) by exporting
#   CODEBASE_MEMORY_ROOT before `devbot up` — the module's up.sh detects the
#   drift and force-recreates this service automatically, because Docker fixes
#   mounts at creation and bin/up.sh runs compose with --no-recreate. (The old
#   `devbot down && devbot up` no longer works: down is gated on the session
#   registry and removes nothing while any devbot instance is alive.)
#   create_host_path: false — a missing source here is a misconfiguration, so
#   fail loudly rather than mount an empty, root-owned directory.
#
# USER — the server runs as the HOST uid/gid, but not via `user:`.
#   The named volume's owner cannot be baked into the image (the host uid is only
#   known at run time) and the server validates that it owns the store. So the
#   image's entrypoint starts as root, chowns the store to DEV_UID/DEV_GID, and
#   drops to that uid with setpriv before exec'ing the server (entrypoint.sh).
#   Root is confined to the container: the repo mount is read-only and the
#   volume is the only writable target. bin/up.sh exports DEV_UID/DEV_GID; the
#   1000 fallback covers a bare `docker compose up`.
name: devbot

services:
  codebase-memory-mcp:
    build:
      # ABSOLUTE, via ${DEV_BOT_ROOT}: compose resolves a relative context
      # against the FIRST -f file's directory, not this module's. With up.sh's
      # single -f list, `context: .` pointed at src/tools/ollama and the build
      # died with "failed to read dockerfile" whenever no image existed yet.
      # Same rule the consumer fragments' `include:` already documents.
      context: ${DEV_BOT_ROOT}/src/agentic/codebase-memory
    image: dev-bot-codebase-memory-mcp:local
    container_name: dev-bot-codebase-memory-mcp
    # Started on demand by `devbot up` and left running. Deliberately NOT
    # `unless-stopped`: the gateway is a dev machine service tied to the dev-bot
    # services around it, so it should not come back on its own after a reboot
    # without `devbot up` having started its neighbours.
    restart: "no"
    ports:
      # Host-local only — the gateway is never exposed off the machine.
      - "127.0.0.1:18504:18504"
    volumes:
      # Index store — a named volume, see the STORE note above.
      - devbot-codebase-memory-store:/srv/cbm
      # Repos, read-only, at their real absolute paths, see the MOUNTS note.
      - type: bind
        source: ${CODEBASE_MEMORY_ROOT:-$HOME}
        target: ${CODEBASE_MEMORY_ROOT:-$HOME}
        read_only: true
        bind:
          create_host_path: false
    environment:
      # The container's own home, on the volume — NOT the host home. The repo
      # mount target above is a path, independent of this.
      HOME: /srv/cbm
      # Set explicitly so the store path does not depend on the server's own
      # defaulting. Its parent (/srv/cbm) is the volume root, owned by DEV_UID.
      CBM_CACHE_DIR: /srv/cbm/store
      # Consumed by entrypoint.sh to chown the volume before dropping root.
      DEV_UID: "${DEV_UID:-1000}"
      DEV_GID: "${DEV_GID:-1000}"
    healthcheck:
      # Liveness via a real MCP handshake on the container's own port, so
      # `docker ps` shows a gateway that has stopped answering as unhealthy.
      # python3, not curl: the bridge images install python3 for mcp-proxy and
      # carry no HTTP client.
      test:
        - CMD
        - python3
        - -c
        - |
          import json, sys, urllib.request
          url = "http://127.0.0.1:18504/mcp"
          accept = "application/json, text/event-stream"
          body = json.dumps({"jsonrpc": "2.0", "id": 1, "method": "initialize",
                             "params": {"protocolVersion": "2024-11-05",
                                        "capabilities": {},
                                        "clientInfo": {"name": "healthcheck", "version": "1"}}}).encode()
          req = urllib.request.Request(
              url, data=body,
              headers={"Content-Type": "application/json", "Accept": accept})
          with urllib.request.urlopen(req, timeout=3) as resp:
              ok = resp.status == 200
              sid = resp.headers.get("Mcp-Session-Id")
          # mcp-proxy holds every session until it is told to drop it, and this
          # probe runs every 30s — without the DELETE they accumulate for the
          # container's whole lifetime.
          if sid:
              try:
                  urllib.request.urlopen(
                      urllib.request.Request(
                          url, method="DELETE",
                          headers={"Accept": accept, "Mcp-Session-Id": sid}),
                      timeout=3).close()
              except Exception:
                  pass
          sys.exit(0 if ok else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  devbot-codebase-memory-store:
    # Pinned. Without `name:` compose prefixes the project ("devbot_"), so the
    # documented name would not resolve and every reference to it — the audit
    # check, the SKILL's `docker volume rm` guidance — would fail.
    name: devbot-codebase-memory-store
